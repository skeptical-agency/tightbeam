name: tightbeam
version: 0.4.1
description: "Tightbeam: beam shorts to every platform via OpusClip and keep your whole YouTube catalog optimized. High-g, no drama."
author: Skeptical Agency
homepage: https://github.com/skeptical-agency/tightbeam
license: MIT
tags: [youtube, publishing, opusclip, metadata, automation, creator]
provides_tools:
  - tightbeam_status
  - tightbeam_credits
  - yt_audit
  - yt_watch
  - yt_optimize
  - yt_sweep
  - publish_upload
  - publish_submit
  - publish_schedule
  - publish_status
  - publish_unschedule
optional_env:
  - name: TIGHTBEAM_GOOGLE_CLIENT_ID
    description: "Google Cloud Desktop OAuth client ID (YouTube Data API v3 enabled). Only needed for the YouTube optimizer pillar."
    url: "https://console.cloud.google.com/apis/credentials"
  - name: TIGHTBEAM_GOOGLE_CLIENT_SECRET
    description: "Client secret paired with TIGHTBEAM_GOOGLE_CLIENT_ID."
    secret: true
oauth:
  - id: google
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/youtube.force-ssl
    client_id_env: TIGHTBEAM_GOOGLE_CLIENT_ID
    client_secret_env: TIGHTBEAM_GOOGLE_CLIENT_SECRET
    hosts: [www.googleapis.com]
    authorize_params: {access_type: offline, prompt: consent}
config_schema:
  tag_channel:
    type: str
    default: ""
    label: "Always-on tag"
    description: "Added to every generated tag set, e.g. your channel name."
  default_category:
    type: str
    default: ""
    label: "Default category id"
    description: "Applied only to videos with no category. 20=Gaming, 22=People&Blogs, 27=Education, 28=Science&Tech. Empty = never touch."
  title_source:
    type: str
    choices: [llm, keep]
    default: llm
    label: "Title generation"
    description: "llm = host model drafts and scores candidates (titles mode only); keep = never touch titles."
  daily_update_cap:
    type: int
    default: 60
    label: "Daily videos.update cap"
    description: "Each update costs 50 quota units of the 10,000/day YouTube quota. 60 = 3,000 units."
